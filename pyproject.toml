[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h100-spot-capacity-controller"
version = "0.1.0"
description = "Safe, persistent EC2 Fleet controller for H100 Spot capacity"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "PyYAML>=6,<7",
  "aws-cdk-lib>=2.150,<3",
  "constructs>=10.0,<11",
]

[project.scripts]
h100-spot-controller = "h100_spot_controller.cli:main"

[tool.setuptools.packages.find]
include = ["h100_spot_controller*"]

[tool.unittest]
start-directory = "tests"
